<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>복소사 동아리</title>
<meta name="description" content="복분자, 소주, 사이다를 맛있게 먹기 위한 동아리를 빙자한 3:3 랜덤 미팅">
<meta property="og:title" content="복소사 동아리">
<meta property="og:description" content="복분자, 소주, 사이다를 맛있게 먹기 위한 동아리를 빙자한 3:3 랜덤 미팅">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍶</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF1E6; --panel:#FFFFFF; --text:#26160E; --muted:#7A6255; --line:#F0CDB6;
  --tarp:#FF6A13; --stripe:#FFF8F0; --soju:#2F8F4E; --soju-ink:#FFFFFF;
  --bok:#8E1540; --sojuliq:#D7F0DD; --cider:#A9E2F5; --glass:#B9CFC0;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#15182E;--panel:#212646;--text:#FFF6D8;--muted:#A9AECB;--line:#343A66;--stripe:#F3E6D2;--glass:#5D7A6A;--sojuliq:#C4E6CD}
}
:root[data-theme="dark"]{--bg:#15182E;--panel:#212646;--text:#FFF6D8;--muted:#A9AECB;--line:#343A66;--stripe:#F3E6D2;--glass:#5D7A6A;--sojuliq:#C4E6CD}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font-family:'Gowun Dodum',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:16px;line-height:1.6;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--tarp);outline-offset:2px}

/* 천막과 전구 */
.awning{height:34px;background:repeating-linear-gradient(90deg,var(--tarp) 0 30px,var(--stripe) 30px 60px);position:relative}
.awning::after{content:"";position:absolute;left:0;right:0;bottom:-14px;height:14px;
  background:radial-gradient(circle at 15px 0,var(--tarp) 14px,transparent 15px) 0 0/60px 14px repeat-x,
             radial-gradient(circle at 45px 0,var(--stripe) 14px,transparent 15px) 0 0/60px 14px repeat-x}
.lights{max-width:480px;margin:22px auto 0;padding:0 14px;display:flex;justify-content:space-between;position:relative;height:14px}
.lights::before{content:"";position:absolute;left:14px;right:14px;top:2px;border-top:1px solid var(--muted);opacity:.4}
.lights span{position:relative;width:8px;height:11px;border-radius:50% 50% 45% 45%;background:#FFD66B;box-shadow:0 0 10px 3px #FFD66B77}
.bar{max-width:480px;margin:0 auto;padding:10px 18px 0;display:flex;justify-content:space-between;align-items:center}
.logo{background:none;border:0;font-family:'Black Han Sans',sans-serif;font-size:18px;padding:4px 0}
.coin{font-family:'Black Han Sans',sans-serif;background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:3px 12px;font-size:15px}
.wrap{max-width:480px;margin:0 auto;padding:16px 18px 40px}
.wrap.enter{animation:enter .35s ease both}

/* 글자 */
.title{font-family:'Black Han Sans',sans-serif;font-size:64px;line-height:.95;letter-spacing:-1px;color:var(--tarp)}
.h{font-family:'Black Han Sans',sans-serif;font-size:28px;line-height:1.2;margin-bottom:4px}
.sub{color:var(--muted);margin-bottom:16px}
.lede{margin-top:16px;color:var(--muted)}
small{font-size:.78em;opacity:.8}
.center{text-align:center}

/* 버튼 */
.stack{display:grid;gap:10px;margin-top:24px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 10px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px 14px;background:var(--soju);color:var(--soju-ink);font-family:'Black Han Sans',sans-serif;font-size:19px;box-shadow:0 4px 0 #1D5E32}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #1D5E32}
.btn.ghost{background:var(--panel);color:var(--text);border:2px solid var(--line);box-shadow:none;font-size:16px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn small{font-family:'Gowun Dodum',sans-serif;margin-left:4px}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:14px;padding:8px}

.hero{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:end;margin-top:10px}

/* 병 */
.bottle{width:92px;margin:0 auto;flex:none}
.bottle .neck{width:30px;height:38px;margin:0 auto;border:3px solid var(--glass);border-bottom:0;border-radius:8px 8px 0 0;background:var(--soju);opacity:.9}
.bottle .body{height:190px;border:3px solid var(--glass);border-radius:20px 20px 26px 26px;overflow:hidden;display:flex;flex-direction:column-reverse;background:color-mix(in srgb,var(--panel) 70%,transparent)}
.bottle.sm{width:46px}.bottle.sm .neck{width:16px;height:16px;border-width:2px}.bottle.sm .body{height:84px;border-width:2px;border-radius:10px 10px 14px 14px}
.bottle.wob{animation:wob .4s}
.liq{width:100%;transition:height .35s ease}
.lb{background:var(--bok)}
.ls{background:var(--sojuliq)}
.lc{background:var(--cider) radial-gradient(circle,#ffffffcc 2px,transparent 3px) 0 0/14px 16px}

/* 카드 */
.party{display:grid;gap:10px}
.card{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:12px 14px;display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:center}
.card b{font-size:17px}
.card .k{color:var(--muted);font-size:14px}
.card .perk{font-size:13px;margin-top:2px;color:var(--soju)}
.card.me{border-style:dashed}
.card.rare{border-color:var(--tarp);animation:glow 1.2s ease-in-out 3}
.av{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--bg);font-size:32px;line-height:1;flex:none}
.av.big{width:120px;height:120px;font-size:70px;margin:0 auto 10px}
.av.sm{width:38px;height:38px;font-size:22px}
.av svg{width:78%;height:auto}
.sil{filter:brightness(0);opacity:.55;transition:filter .5s,opacity .5s}
.hide{opacity:0;visibility:hidden}
.pop{animation:pop .45s both}
.stamp{display:inline-block;animation:stamp .45s both}

/* 뽑기 카드 */
.flip{perspective:900px;height:156px}
.flip.shake{animation:shake .4s 2}
.flip .inner{position:relative;height:100%;transition:transform .7s cubic-bezier(.3,1.35,.5,1);transform-style:preserve-3d}
.flip.open .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.back{border-radius:16px;border:3px solid var(--tarp);background:repeating-linear-gradient(45deg,var(--tarp) 0 14px,var(--stripe) 14px 28px);display:grid;place-items:center}
.face.back span{background:var(--panel);width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-family:'Black Han Sans',sans-serif;font-size:30px;color:var(--tarp)}
.face.front{transform:rotateY(180deg)}
.face.front .card{height:100%}

/* 천막 무대 */
.stage{position:relative;overflow:hidden;border-radius:18px;background:var(--panel);border:2px solid var(--line);min-height:220px;display:grid;place-items:center;text-align:center;padding:24px 20px;margin-bottom:18px}
.stage-av{font-size:70px;line-height:1.1;animation:bob 2.4s ease-in-out infinite}
.stage-name{font-family:'Black Han Sans',sans-serif;font-size:26px;display:block;margin:6px 0}
.cur{position:absolute;top:0;bottom:0;width:51%;background:repeating-linear-gradient(90deg,var(--tarp) 0 22px,var(--stripe) 22px 44px);transition:transform 1.1s cubic-bezier(.6,0,.3,1);z-index:2}
.cur.l{left:0}.cur.r{right:0}
.stage.open .cur.l{transform:translateX(-102%)}
.stage.open .cur.r{transform:translateX(102%)}

/* 프롤로그 */
.pro{background:#101327;color:#FFF6D8;border-radius:20px;min-height:62vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:30px 24px;cursor:pointer;user-select:none;-webkit-user-select:none}
.pro-av{font-size:84px;line-height:1.1;margin-bottom:22px;animation:bob 3s ease-in-out infinite}
.pro-t{font-size:19px;line-height:1.8;min-height:5.4em;max-width:22em}
.pro-hint{margin-top:26px;font-size:13px;opacity:.5}
.pro-dots{display:flex;gap:6px;margin-top:14px}
.pro-dots i{width:6px;height:6px;border-radius:50%;background:#FFF6D8;opacity:.25}
.pro-dots i.on{opacity:.9}

/* 선택 */
.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin:10px 0 14px}
.pick{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;transition:transform .15s}
.pick.on{border-color:var(--tarp);background:color-mix(in srgb,var(--tarp) 14%,var(--panel));transform:scale(1.03)}
.label{font-family:'Black Han Sans',sans-serif;font-size:17px;margin:16px 0 4px}

/* 말풍선 */
.talk{display:grid;grid-template-columns:38px 1fr;gap:10px;align-items:start;margin:10px 0}
.bubble{background:var(--panel);border:2px solid var(--line);border-radius:4px 16px 16px 16px;padding:8px 12px}
.bubble b{display:block;font-size:13px;color:var(--muted);font-weight:400}

/* 제조 */
.mix{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;margin:8px 0 18px}
.ing{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line)}
.ing:last-of-type{border-bottom:0}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.step{width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--panel);font-size:20px;line-height:1}
.step.pour{background:var(--soju);color:#fff;border-color:var(--soju)}
.mstate{font-size:14px;color:var(--muted);margin-top:8px;min-height:1.6em}

/* 테이블 위 */
.tabletop{display:flex;gap:12px;align-items:flex-end;margin-bottom:6px}
.tabletop .talk{margin:0;flex:1}
.banner{font-family:'Black Han Sans',sans-serif;font-size:58px;line-height:1.1;color:var(--tarp);text-align:center;margin:44px 0 8px;animation:slam .6s both;text-shadow:3px 3px 0 var(--bok)}

/* 미니게임 */
.game{background:var(--panel);border:2px solid var(--line);border-radius:20px;padding:18px;text-align:center;margin-top:12px}
.game .gname{font-family:'Black Han Sans',sans-serif;font-size:24px}
.game .rule{color:var(--muted);font-size:14px;margin-bottom:14px}
.num{font-family:'Black Han Sans',sans-serif;font-size:96px;line-height:1.1;color:var(--tarp)}
.num.bump{animation:pop .25s}
.tbar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:6px 0 16px}
.tbar i{display:block;height:100%;width:100%;background:var(--tarp)}
.track{position:relative;height:64px;border-radius:14px;background:var(--bg);border:2px solid var(--line);margin:10px 0 16px;overflow:hidden}
.zone{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--soju) 40%,transparent);border-left:2px solid var(--soju);border-right:2px solid var(--soju)}
.needle{position:absolute;top:6px;bottom:6px;width:8px;margin-left:-4px;border-radius:4px;background:var(--bok)}
.ud{display:grid;grid-template-columns:1fr auto;gap:8px;margin:8px 0}
.ud input{font:inherit;font-size:22px;text-align:center;padding:10px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--text);width:100%}
.hist{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:30px;margin-top:8px}
.chip{border:2px solid var(--line);border-radius:99px;padding:1px 10px;font-size:14px;animation:pop .3s}

/* 잔 */
.glass{width:92px;height:118px;margin:14px auto 6px;border:3px solid var(--glass);border-top:0;border-radius:0 0 20px 20px;position:relative;overflow:hidden;display:flex;align-items:flex-end}
.glass .fill{width:100%;height:86%;animation:rise 1s ease-out both}
.oneshot{font-family:'Black Han Sans',sans-serif;font-size:42px;color:var(--tarp);text-align:center;animation:stamp .5s both;animation-delay:1.05s}
.late{animation:pop .4s both;animation-delay:var(--d,1.3s)}
.big-msg{font-family:'Black Han Sans',sans-serif;font-size:30px;line-height:1.25;margin:12px 0 6px}

/* 점수, 2차 */
.heart{position:relative;height:18px;border-radius:99px;background:var(--line);overflow:visible;margin:8px 0 4px}
.heart i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--bok),var(--tarp));transition:width .8s cubic-bezier(.2,.8,.2,1)}
.heart b{position:absolute;top:-5px;bottom:-5px;width:3px;margin-left:-1px;background:var(--text);border-radius:2px}
.hnum{text-align:center;font-size:14px;color:var(--muted);margin-bottom:10px}
.hnum span{font-family:'Black Han Sans',sans-serif;font-size:20px;color:var(--bok)}
.prow{display:flex;justify-content:space-between;font-size:14px;padding:2px 0}
.score{display:grid;gap:9px;margin:14px 0 20px}
.srow{display:grid;grid-template-columns:38px 70px 1fr;gap:8px;align-items:center;font-size:14px}
.srow .m{height:14px;border-radius:99px;background:var(--line);overflow:hidden}
.srow .m i{display:block;height:100%;width:0;background:var(--bok);transition:width 1s cubic-bezier(.2,.8,.2,1)}
.srow.top span{font-weight:700;color:var(--tarp)}
.tapbtn{width:220px;height:220px;border-radius:50%;border:0;margin:16px auto 10px;display:grid;place-items:center;background:var(--bok);color:#fff;font-family:'Black Han Sans',sans-serif;font-size:58px;box-shadow:0 8px 0 #5A0C28;user-select:none;-webkit-user-select:none;touch-action:none}
.tapbtn:active{transform:translateY(5px);box-shadow:0 3px 0 #5A0C28}
.gauge{height:16px;border-radius:99px;background:var(--line);overflow:hidden;margin:4px 0 6px}
.gauge i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--bok),var(--tarp));transition:width .08s}
.mods{font-size:14px;color:var(--muted);margin:4px 0 8px}
.fh{position:fixed;pointer-events:none;font-size:26px;animation:floatUp .8s forwards;z-index:30}
.cf{position:fixed;top:0;font-size:24px;pointer-events:none;z-index:30;animation:fall linear forwards}
.seal{display:inline-block;font-family:'Black Han Sans',sans-serif;color:var(--tarp);border:4px solid var(--tarp);border-radius:12px;padding:4px 14px;font-size:24px;transform:rotate(-6deg);animation:stamp .5s both;animation-delay:.3s}

/* 도감 */
.tabs{display:flex;gap:6px;overflow-x:auto;margin:6px 0 16px;padding-bottom:4px}
.tab{flex:none;border:2px solid var(--line);background:var(--panel);border-radius:99px;padding:6px 14px;font-size:15px}
.tab.on{background:var(--tarp);border-color:var(--tarp);color:#fff}
.cats{margin-top:-6px}
.cats .tab{font-size:14px;padding:4px 12px}
.cats .tab.on{background:var(--soju);border-color:var(--soju)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cell{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:10px 4px;text-align:center;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:112px}
.cell .q{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--bg);font-family:'Black Han Sans',sans-serif;font-size:26px;color:var(--muted)}
.cell .hint{font-size:11px;color:var(--muted);line-height:1.35}
.list{display:grid;gap:8px}
.ach{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:10px 14px}
.ach.off{opacity:.55}
.ach b{display:block}
.note{margin-top:6px}
.acct{margin-top:18px;font-size:14px}
.acct .link{display:block;margin:4px auto 0}
.nudge{border-color:var(--tarp);font-size:14px;margin-top:12px}
.filebtn{text-align:center;cursor:pointer}
.hintline{display:block;margin-top:6px;color:var(--text)}
.mratio{margin-top:8px}
.mratio small{display:block;margin-top:3px;font-size:13px}
.clue{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);margin-bottom:4px}
.clue i{width:14px;height:14px;border-radius:50%;border:2px solid var(--tarp)}
.clue i.on{background:var(--tarp)}
.clue span{margin-left:4px}
.note small{display:block;margin-top:2px}
.code{width:100%;min-height:84px;font:12px/1.4 ui-monospace,Menlo,monospace;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--text);padding:8px;margin:6px 0 8px;word-break:break-all;resize:vertical}
.rec{display:flex;height:14px;border-radius:99px;overflow:hidden;margin-top:6px;background:var(--line)}
.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:20px;z-index:10}
.modal[hidden]{display:none}
.sheet{background:var(--panel);border-radius:20px;padding:22px;max-width:400px;width:100%;max-height:85vh;overflow:auto;animation:pop .3s}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,140px);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:15px;transition:transform .3s;z-index:40;max-width:90vw;text-align:center}
.toast.on{transform:translate(-50%,0)}

@keyframes enter{from{opacity:0;transform:translateY(10px)}}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-3deg)}75%{transform:rotate(3deg)}}
@keyframes pop{0%{opacity:0;transform:scale(.6)}70%{opacity:1;transform:scale(1.06)}100%{opacity:1;transform:none}}
@keyframes stamp{0%{opacity:0;transform:scale(2.4)}60%{opacity:1;transform:scale(.92)}100%{opacity:1}}
@keyframes slam{0%{opacity:0;transform:scale(3) rotate(-10deg)}55%{opacity:1;transform:scale(.9) rotate(-3deg)}75%{transform:scale(1.06) rotate(-3deg)}100%{opacity:1;transform:rotate(-3deg)}}
@keyframes wob{0%,100%{transform:rotate(0)}30%{transform:rotate(-6deg)}65%{transform:rotate(4deg)}}
@keyframes rise{from{height:0}}
@keyframes bob{50%{transform:translateY(-8px)}}
@keyframes glow{50%{box-shadow:0 0 0 3px var(--tarp),0 0 22px var(--tarp)}}
@keyframes floatUp{from{opacity:1;transform:translate(-50%,-50%)}to{opacity:0;transform:translate(-50%,-150px) scale(1.5)}}
@keyframes fall{from{transform:translateY(-8vh) rotate(0)}to{transform:translateY(110vh) rotate(420deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="awning" aria-hidden="true"></div>
<div class="lights" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
<header class="bar">
  <button class="logo" onclick="home()">복소사 동아리</button>
  <span class="coin" aria-label="코인">🪙 <b id="coins">0</b></span>
</header>
<main id="app" class="wrap"></main>
<div id="modal" class="modal" hidden onclick="if(event.target===this)closeModal()"></div>
<div id="toast" class="toast" role="status"></div>

<script>
/* ================= 데이터 ================= */
const TANK='<svg viewBox="0 0 64 40" aria-hidden="true"><rect x="4" y="22" width="56" height="13" rx="6.5" fill="#3F4B30"/><circle cx="13" cy="28.5" r="3.2" fill="#232A1B"/><circle cx="24" cy="28.5" r="3.2" fill="#232A1B"/><circle cx="35" cy="28.5" r="3.2" fill="#232A1B"/><circle cx="46" cy="28.5" r="3.2" fill="#232A1B"/><rect x="14" y="11" width="28" height="13" rx="5" fill="#5E6F47"/><rect x="40" y="14" width="22" height="4.5" rx="2.2" fill="#5E6F47"/></svg>';

/* ================= 미팅 상대 등장 ================= */
const placeOf=()=>PLACES.find(p=>p.id===G.place);
function pickOpps(){
  let pool=OPP.filter(o=>S.opp[o.id]!=='member').map(o=>({o,w:o.w*(has(CAT_BOOST[o.cat])?3:1)*(placeOf()&&placeOf().boost===o.cat?2:1)*(G.catUp===o.cat?3:1)+(o.cond&&has(o.cond.comp)?o.cond.bonus:0)})).filter(x=>x.w>0);
  const out=[];
  while(out.length<3&&pool.length){const sum=pool.reduce((a,x)=>a+x.w,0);let r=Math.random()*sum,i=0;for(;i<pool.length;i++){r-=pool[i].w;if(r<=0)break}i=Math.min(i,pool.length-1);out.push(pool[i].o.id);pool.splice(i,1)}
  return out;
}

/* ---------- 레시피 추리 (코인) ---------- */
const INGN=['복분자','소주','사이다'];
function amountWord(v){return v===0?'아예 안 넣는':v<=2?'조금만 넣는':v<=4?'적당히 넣는':v<=6?'절반쯤 넣는':v<=9?'잔뜩 넣는':'그것만 넣는'}
function makeHints(o){const r=o.r,mx=Math.max(...r),mn=Math.min(...r),hs=[];
  r.forEach((v,i)=>{if(v===mx)hs.push(`${INGN[i]}를 가장 좋아하는 것 같다.`)});
  r.forEach((v,i)=>{if(v===mn)hs.push(v===0?`${INGN[i]}는 아예 안 넣는 게 좋겠다.`:`${INGN[i]}는 별로 안 좋아하는 것 같다.`)});
  r.forEach((v,i)=>hs.push(`${INGN[i]}는 ${amountWord(v)} 편이 좋아 보인다.`));
  return [...new Set(hs)]}
function newHints(id){const have=S.hints[id]||[];return makeHints(byId(id)).filter(h=>!have.includes(h))}
function shopHTML(){const unk=G.opps.filter(id=>!S.rec[id]);const n=Math.min(S.clue||0,CLUE_MAX),free=n>=CLUE_MAX;
  return `<div class="label" style="margin-top:18px">레시피 추리</div>
<p class="sub" style="margin-bottom:8px">코인으로 오늘 상대의 취향을 알아낸다. 힌트나 유추를 ${CLUE_MAX}번 하면 확정 공개 1회가 무료.</p>
<div class="clue">${Array.from({length:CLUE_MAX},(_,i)=>`<i class="${i<n?'on':''}"></i>`).join('')}<span>${free?'확정 공개 무료!':`무료까지 ${CLUE_MAX-n}번`}</span></div>
<div class="row" style="grid-template-columns:1fr 1fr 1fr">
  <button class="btn ghost" ${unk.length?'':'disabled'} onclick="buyHint()">힌트<br><small>${HINT_COST}코인</small></button>
  <button class="btn ghost" ${unk.length?'':'disabled'} onclick="buyGuess()">랜덤 유추<br><small>${GUESS_COST}코인</small></button>
  <button class="btn ghost" ${unk.length?'':'disabled'} onclick="pickReveal()">확정 공개<br><small>${free?'무료':REVEAL_COST+'코인'}</small></button>
</div>
<div id="rvpick"></div>
${unk.length?'':'<p class="sub">오늘 상대들의 레시피는 모두 알고 있다.</p>'}`}
function payFor(cost){if(S.coins<cost){toast('코인이 부족하다.');return false}addCoins(-cost);return true}
function addClue(){S.clue=Math.min(CLUE_MAX,(S.clue||0)+1)}
function revealRec(id){S.rec[id]=true;save();toast(`${nameOf(id)}의 레시피를 알아냈다!`);refreshMix()}
function buyHint(){const cand=G.opps.filter(id=>!S.rec[id]&&newHints(id).length);
  if(!cand.length){toast('더 알아낼 힌트가 없다. 유추나 확정 공개를 써보자.');return}
  if(!payFor(HINT_COST))return;const id=pick(cand),h=pick(newHints(id));(S.hints[id]=S.hints[id]||[]).push(h);addClue();save();
  toast(`${nameOf(id)}: ${h}`);refreshMix()}
function buyGuess(){const cand=G.opps.filter(id=>!S.rec[id]);if(!cand.length)return;if(!payFor(GUESS_COST))return;addClue();revealRec(pick(cand))}
function pickReveal(){const cand=G.opps.filter(id=>!S.rec[id]);if(!cand.length)return;const free=(S.clue||0)>=CLUE_MAX;
  $('#rvpick').innerHTML=`<p class="sub" style="margin:4px 0 6px">누구의 레시피를 공개할까? ${free?'(무료)':`(${REVEAL_COST}코인)`}</p><div class="choices">${cand.map(id=>`<button class="pick" onclick="doReveal('${id}')">${avOf(id,'sm')}<b>${nameOf(id)}</b></button>`).join('')}</div>`}
function doReveal(id){if((S.clue||0)>=CLUE_MAX){S.clue=0}else if(!payFor(REVEAL_COST))return;revealRec(id)}
function adj(k,d){const t=G.bt.b+G.bt.s+G.bt.c;if(d>0&&t>=CAP){toast('병이 가득 찼다.');return}if(d<0&&G.bt[k]<=0)return;G.bt[k]+=d;updateMix(true)}
function updateMix(wob){const t=G.bt.b+G.bt.s+G.bt.c;$('#mb').innerHTML=bottleHTML(G.bt,CAP);if(wob)$('#mb .bottle').classList.add('wob');
  $('#mixgo').disabled=t<MIN;
  $('#mratio').innerHTML=t?`${pctBar([G.bt.b,G.bt.s,G.bt.c].map(x=>x/t*100))}<small>${recText([G.bt.b,G.bt.s,G.bt.c].map(x=>Math.round(x*10/t)))} <span class="k">(10 기준)</span></small>`:'';
  $('#mst').textContent=t===0?'병이 비어 있다.':t<MIN?'아직 병이 휑하다. 좀 더 부어야 한다.':t>=CAP?'병이 가득 찼다.':'이대로 섞어도 되고, 더 부어도 된다.'}
function react(o){
  const t=G.bt.b+G.bt.s+G.bt.c;const mine=[G.bt.b,G.bt.s,G.bt.c].map(x=>x*10/t);
  const diff=mine.map((x,i)=>x-o.r[i]);const hit=mine.every((x,i)=>Math.round(x)===o.r[i]);const d=hit?0:diff.reduce((a,x)=>a+Math.abs(x),0);
  G.dist[o.id]=d;
  if(d<0.01)return{d,line:'이거예요. 제 인생 복소사.'};
  if(d<=2)return{d,line:'오, 거의 제 취향인데요? 살짝만 다르게.'};
  let mi=0;diff.forEach((x,i)=>{if(Math.abs(x)>Math.abs(diff[mi]))mi=i});
  const L=[['복분자가 너무 진해요.','복분자 향이 좀 아쉬워요.'],['으, 너무 독해요.','소주는 어디 갔어요?'],['사이다 맛밖에 안 나요.','좀 더 톡 쏘면 좋겠는데.']];
  return{d,line:(d>8?'음... ':'')+L[mi][diff[mi]>0?0:1]};
}
function mixDone(){
  const {b,s,c}=G.bt,t=b+s+c;
  if(s>0&&!b&&!c)unlock('soju_only');
  if(c>0&&!b&&!s)unlock('cider_party');
  G.cap=t;G.remaining=t;
  ['me',...G.party,...G.opps].forEach(id=>G.drinks[id]=0);
  const found=[];
  const pc=[b,s,c].map(x=>Math.round(x/t*100));
  const lines=G.opps.map((id,i)=>{const o=byId(id);const r=react(o);(S.notes[id]=S.notes[id]||[]).push({p:pc,l:r.line});S.notes[id]=S.notes[id].slice(-5);if(r.d<0.01&&!S.rec[id]){S.rec[id]=true;found.push(o.name)}return `<div class="late" style="--d:${.3+i*.6}s">${talk(id,r.line)}</div>`}).join('');
  const mine=[b,s,c].map(x=>Math.round(x*10/t));const past=[];
  OPP.forEach(o=>{if(S.opp[o.id]&&!S.rec[o.id]&&!G.opps.includes(o.id)&&o.r.every((v,i)=>v===mine[i])){S.rec[o.id]=true;past.push(S.opp[o.id]==='member'?o.name:'???')}});
  if(past.length){found.push(...past);later(300+G.opps.length*600+1200,()=>toast(`지난번에 만난 ${past.length}명의 레시피와 일치해서 도감에 등록했다!`))}
  save();
  if(found.length){later(300+G.opps.length*600,()=>{unlock('perfect');toast(found.join(', ')+'의 레시피 발견!')})}
  screen(`
<h2 class="h">한 모금씩 맛을 봤다</h2>
<p class="sub">반응을 잘 기억해 두자. 취향에 가까울수록 나중에 마음을 얻기 쉬워진다.</p>
${lines}
<div class="late" style="--d:${.3+G.opps.length*.6}s;margin-top:12px"><button class="btn" onclick="round()">건배!</button></div>`)}

/* ---------- 입담 이벤트 ---------- */
const TALKQ=[
 {id:'q1',q:'제 첫인상 어땠어요?',a:['눈부셨어요.','솔직히 좀 무서웠어요.','기억이 잘 안 나요.']},
 {id:'q2',q:'주말엔 보통 뭐 해요?',a:['잠만 자요.','운동해요.','복소사 비율 연구해요.']},
 {id:'q3',q:'군대 얘기 좀 해줘요.',a:['축구 얘기 해도 돼요?','그건 군사기밀입니다.','저 지금도 군인인데요.']},
 {id:'q4',q:'이상형이 뭐예요?',a:['지금 제 앞에 계신 분.','복소사 잘 마는 사람.','아직 잘 모르겠어요.']},
 {id:'q5',q:'제 이름 기억나요?',a:['당연하죠.','...힌트 좀 주세요.','이름보다 얼굴이 기억나요.']},
 {id:'q6',q:'노래방 가면 뭐 불러요?',a:['발라드요.','트로트요.','탬버린 담당이에요.']},
 {id:'q7',q:'안주는 뭐가 제일 좋아요?',a:['어묵탕이요.','과일이요.','안주는 사치예요.']},
 {id:'q8',q:'첫 데이트는 어디가 좋아요?',a:['놀이공원이요.','조용한 카페요.','여기 같은 포차요.']}
];
function hsh(str){let h=7;for(const ch of str)h=(h*31+ch.charCodeAt(0))>>>0;return h}
function chatEvent(g){
  const who=pick(G.opps);const q=pick(TALKQ.filter(x=>!G.asked.includes(x.id)));G.asked.push(q.id);G.chat={who,q,g};
  const past=(S.talks[who]||{})[q.id];
  screen(`${tableTop()}<p class="big-msg">${josa(nameOf(who),'이','가')} 말을 건다</p>
${talk(who,q.q)}
<div class="stack" style="margin-top:12px">${q.a.map((a,i)=>`<button class="btn ghost" onclick="answer(${i})">${a}${past&&past.a===i?`<br><small>지난번: ${past.res>0?'좋아했다':past.res<0?'별로였다':'무난했다'}</small>`:''}</button>`).join('')}</div>`)}
function answer(i){
  const {who,q,g}=G.chat;const best=hsh(who+q.id)%3,bad=(best+1)%3;const res=i===best?1:i===bad?-1:0;
  G.charm[who]=(G.charm[who]||0)+res;S.talks[who]=S.talks[who]||{};S.talks[who][q.id]={a:i,res};

  const id=G.date.id,{best,bad}=datePref(id,key);const res=i===best?1:i===bad?-1:0;
  const big=key==='place'||key==='ask';const dv=res>0?12:res<0?-8:(big?4:3);
  const before=G.date.heart;G.date.heart=Math.max(0,Math.min(100,before+dv));if(res<=0)G.date.allGood=false;
  (S.dates[id]=S.dates[id]||{})[key]={a:i,res};save();

  screen(`<p class="big-msg">${res>0?'분위기가 좋아졌다':res<0?'분위기가 식었다':'무난하게 흘러갔다'}</p>

${talk(id,pick(DATE_LINES[res>0?'good':res<0?'bad':'mid']))}
${heartHTML(before)}

<div class="late" style="--d:1s"><button class="btn" onclick="${next}">${key==='ask'?'대답을 기다린다':'계속'}</button></div>`);

function dateEnd(){
  const {id,heart,allGood}=G.date;const ok=heart>=DATE_GOAL;
  if(ok&&allGood)unlock('soulmate');
  screen(`<div class="center">${avHTML(byId(id).av,'big')}<p class="big-msg">${heart>=100?'심장이 터질 것 같다...':'두근두근...'}</p></div>${heartHTML(heart)}`);
  later(1500,()=>{if(heart>=100)nightStart(id);else if(ok)result(id,true);else playScenes(rejectScenes(id),()=>result(id,false))});
}

      return `<div class="cell"><span class="q">?</span><b>???</b>${o.hint?`<span class="hint">${o.hint}</span>`:''}</div>`}).join('')}</div>`;
  }else if(dexTab==='comp'){
    body=`<div class="party">${COMP.map(c=>S.comp[c.id]?compInner(c):`<div class="card">${avHTML(c.av,'',true)}<div><b>???</b><div class="k">아직 함께한 적 없는 동료</div></div></div>`).join('')}</div>`;
  }else if(dexTab==='rec'){
    body=chips(o=>S.rec[o.id])+`<div class="list">${inCat.map(o=>{const known=S.opp[o.id]==='member';
      return `<div class="ach ${S.rec[o.id]?'':'off'}"><div style="display:flex;gap:10px;align-items:center">${S.opp[o.id]?avHTML(o.av,'sm',!known):'<span class="av sm">?</span>'}<b>${known?o.name:'???'}의 복소사</b></div>${S.rec[o.id]?recBar(o.r)+`<small>복분자 ${o.r[0]} : 소주 ${o.r[1]} : 사이다 ${o.r[2]}</small>`:'<small>정확한 비율로 섞으면 발견된다.</small>'}</div>`}).join('')}</div>`;
  }else if(dexTab==='place'){
    body=`<div class="party">${PLACES.map(p=>S.place[p.id]?`<div class="card">${avHTML(p.av)}<div><b>${p.name}</b><div class="k">${p.desc}</div><div class="perk">${p.boost?CATNAME[p.boost]+' 손님이 자주 온다':'손님이 고르게 온다'}</div></div></div>`:`<div class="card">${avHTML(p.av,'',true)}<div><b>???</b></div></div>`).join('')}</div><p class="sub" style="margin-top:12px">새 장소는 업데이트로 추가된다.</p>`;
  }else{
    body=`<div class="list">${ACH.map(a=>{const on=S.ach[a.id];const show=on||!a.hidden;return `<div class="ach ${on?'':'off'}"><b>${show?a.name:'숨겨진 업적'}</b><small>${show?a.desc:'조건을 찾아보자.'}</small></div>`}).join('')}</div>`;
  }
  screen(`<h2 class="h">도감</h2><p class="sub">플레이 ${S.plays}회</p>
<div class="tabs" role="tablist">${tabs.map(([k,n,c])=>`<button class="tab ${dexTab===k?'on':''}" role="tab" aria-selected="${dexTab===k}" onclick="dexTab='${k}';dex()">${n} <small>${c}</small></button>`).join('')}</div>
${body}
<div style="height:20px"></div>
<button class="btn" onclick="home()">처음으로</button>
<div class="center" style="margin-top:20px"><button class="link" onclick="openBackup()">기록 백업 / 불러오기</button><br><button class="link" onclick="resetSave()">${resetArm?'한 번 더 누르면 모든 기록이 지워진다':'기록 초기화'}</button></div>`);
}
function detail(id){
  const o=byId(id);const m=S.opp[id]==='member';
  $('#modal').innerHTML=`<div class="sheet"><div class="center">${avHTML(o.av,'big',!m)}<p class="big-msg">${m?o.name:'???'}</p><p class="sub">${m?o.kind+' ('+CATNAME[o.cat]+')':'실루엣만 기억난다. ('+CATNAME[o.cat]+')'}</p></div>
${m&&S.love[id]?`<div class="ach center" style="margin-bottom:10px">💞 <b style="display:inline">${LOVE_NAME[S.love[id].stage]}</b>${loveReady(id)?`<div style="margin-top:8px"><button class="btn" style="font-size:15px;padding:8px" onclick="loveVisit('${id}')">만나러 가기</button></div>`:''}</div>`:''}
${m?`<p>${o.profile}</p><div class="label">좋아하는 복소사</div>${S.rec[id]?recBar(o.r)+`<small>복분자 ${o.r[0]} : 소주 ${o.r[1]} : 사이다 ${o.r[2]}</small>`:'<small>아직 모른다. 미팅에서 비율을 맞혀보자.</small>'}
<div class="label">한마디</div>${o.lines.map(l=>`<p>"${l}"</p>`).join('')}`:`<p class="sub">유혹에 성공하면 정보가 공개된다.${o.hint?'<br>'+o.hint:''}</p>`}
<div class="label">레시피 노트</div>${hintHTML(id)}${noteHTML(id,5)}
<div class="label">2차 기록</div>${(()=>{const dd=Object.entries(S.dates[id]||{});return dd.length?dd.map(([k,r])=>{const q=k==='place'?{q:'2차 장소',a:DATE_PLACES.map(p=>p.name)}:k==='ask'?ASKQ:DATEQ.find(x=>x.id===k);return `<p><small class="k">${q.q}</small><br>${q.a[r.a]} <small>(${resWord(r.res)})</small></p>`}).join(''):'<small class="k">아직 2차를 가 본 적이 없다.</small>'})()}
<div class="label">1차 대화 기록</div>${(()=>{const tk=Object.entries(S.talks[id]||{});return tk.length?tk.map(([qid,r])=>{const q=TALKQ.find(x=>x.id===qid);return `<p><small class="k">${q.q}</small><br>${q.a[r.a]} <small>(${r.res>0?'좋아했다':r.res<0?'별로였다':'무난했다'})</small></p>`}).join(''):'<small class="k">아직 나눈 대화가 없다.</small>'})()}
<div style="height:16px"></div><button class="btn ghost" onclick="closeModal()">닫기</button></div>`;
  $('#modal').hidden=false;
}
function closeModal(){$('#modal').hidden=true}
/* ---------- 백업 코드 ---------- */
let imArm=false;
const backupCode=()=>'BSS1.'+btoa(unescape(encodeURIComponent(JSON.stringify(S))));
function openBackup(){imArm=false;const code=backupCode();
  $('#modal').innerHTML=`<div class="sheet"><p class="big-msg" style="margin-top:0">기록 백업</p>
<p class="sub">아래 코드를 복사해 메모장이나 메시지에 보관해 두자. 다른 기기에서 붙여넣으면 도감이 그대로 돌아온다.</p>
<textarea id="bk" class="code" readonly>${code}</textarea>
<div class="row" style="margin:0 0 6px"><button class="btn" onclick="copyCode()">코드 복사</button><button class="btn ghost" onclick="saveFile()">파일로 저장</button></div>
<div class="label">불러오기</div>
<textarea id="im" class="code" placeholder="백업 코드를 붙여넣기"></textarea>
<label class="btn ghost filebtn">백업 파일 선택<input type="file" accept=".txt,text/plain" onchange="loadFile(this)" hidden></label>
<button class="btn ghost" id="imb" onclick="importCode()">불러오기</button>
<div style="height:12px"></div><button class="btn ghost" onclick="closeModal()">닫기</button></div>`;
  $('#modal').hidden=false}
function copyCode(){const t=$('#bk');t.select();const ok=()=>{S.lastBackup=S.plays;save();toast('코드를 복사했다.')};
  const fb=()=>{try{document.execCommand('copy');ok()}catch(e){toast('코드를 길게 눌러 직접 복사하자.')}};
  if(navigator.clipboard)navigator.clipboard.writeText(t.value).then(ok,fb);else fb()}
async function saveFile(){let d=null;try{d=window.claude&&await window.claude.use('downloads')}catch(e){}
  if(!d){try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([backupCode()],{type:'text/plain'}));a.download=`boksosa_backup_${S.plays}.txt`;document.body.appendChild(a);a.click();a.remove();S.lastBackup=S.plays;save();toast('백업 파일을 저장했다.')}catch(e){toast('파일 저장에 실패했다. 코드 복사를 이용하자.')}return}
  try{await d.save({filename:`boksosa_backup_${S.plays}.txt`,data:backupCode()});S.lastBackup=S.plays;save();toast('백업 파일을 저장했다.')}
  catch(e){if(e&&e.code==='declined')return;toast('저장하지 못했다. 코드 복사를 이용하자.')}}
function loadFile(inp){const f=inp.files&&inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#im').value=String(r.result).trim();toast('파일을 읽었다. 불러오기를 눌러 적용하자.')};r.readAsText(f)}
function importCode(){const v=$('#im').value.trim();let o;
  try{if(!v.startsWith('BSS1.'))throw 0;o=JSON.parse(decodeURIComponent(escape(atob(v.slice(5)))));if(!o||typeof o!=='object'||!o.opp)throw 0}catch(e){toast('올바른 백업 코드가 아니다.');return}
  if(!imArm){imArm=true;$('#imb').textContent='한 번 더 누르면 지금 기록을 덮어쓴다';return}
  S=Object.assign(blank(),o);save();closeModal();toast('기록을 불러왔다.');home()}
function resetSave(){if(!resetArm){resetArm=true;dex();later(4000,()=>{resetArm=false});return}resetArm=false;S=blank();save();toast('기록을 초기화했다.');home()}

home();
</script>
<script type="module">
/* ============ Firebase 설정: 가이드 3단계에서 복사한 값으로 바꾸기 ============ */
const firebaseConfig = {
  apiKey: "여기에_apiKey",
  authDomain: "여기에_authDomain",
  projectId: "여기에_projectId",
  storageBucket: "여기에_storageBucket",
  messagingSenderId: "여기에_messagingSenderId",
  appId: "여기에_appId"
};
/* ========================================================================== */
const C = window.CLOUD = {off:false, ready:false, user:null, status:''};
const rerender = () => { if (window.ON_HOME) home(); };
if (firebaseConfig.apiKey.startsWith("여기에")) {
  C.off = true; rerender();
} else {
  const V = "10.12.2", base = `https://www.gstatic.com/firebasejs/${V}/`;
  const [{initializeApp}, A, F] = await Promise.all([
    import(base+"firebase-app.js"), import(base+"firebase-auth.js"), import(base+"firebase-firestore.js")]);
  const app = initializeApp(firebaseConfig);
  const auth = A.getAuth(app), db = F.getFirestore(app);
  let timer = null, busy = false;
  const ref = () => F.doc(db, "users", C.user.uid);
  const sizeOf = o => (o.plays||0) + Object.values(o.opp||{}).filter(v=>v==='member').length*10;

  C.push = () => {
    clearTimeout(timer);
    timer = setTimeout(async () => {
      if (!C.user || busy) return;
      try {
        await F.setDoc(ref(), {save: JSON.stringify(S), plays: S.plays||0, updatedAt: F.serverTimestamp()});
        C.status = '방금 저장됨';
      } catch (e) { C.status = '저장 실패. 인터넷 연결을 확인하자.'; }
    }, 1500);
  };
  C.login = async () => {
    const p = new A.GoogleAuthProvider();
    try { await A.signInWithPopup(auth, p); }
    catch (e) {
      if (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment') await A.signInWithRedirect(auth, p);
      else if (e.code !== 'auth/popup-closed-by-user' && e.code !== 'auth/cancelled-popup-request') toast('로그인에 실패했다. 크롬이나 사파리에서 다시 시도하자.');
    }
  };
  C.logout = async () => { await A.signOut(auth); toast('로그아웃했다. 기록은 이 기기에 남아 있다.'); };
  C.useCloud = cloud => { S = Object.assign(blank(), cloud); try{localStorage.setItem(KEY, JSON.stringify(S))}catch(e){}; closeModal(); toast('클라우드 기록을 불러왔다.'); home(); };
  C.useLocal = () => { closeModal(); C.push(); toast('이 기기 기록으로 클라우드를 덮어썼다.'); rerender(); };

  A.getRedirectResult(auth).catch(()=>{});
  A.onAuthStateChanged(auth, async user => {
    C.user = user; C.ready = true; C.status = '';
    if (!user) { rerender(); return; }
    busy = true;
    try {
      const snap = await F.getDoc(ref());
      if (!snap.exists()) {
        busy = false; C.push(); toast('클라우드 저장을 시작했다.');
      } else {
        const cloud = JSON.parse(snap.data().save);
        const localEmpty = sizeOf(S) === 0;
        busy = false;
        if (localEmpty || JSON.stringify(cloud) === JSON.stringify(S)) { C.useCloud(cloud); return; }
        C.pending = cloud;
        const m = o => OPP.filter(x => (o.opp||{})[x.id]==='member').length;
        $('#modal').innerHTML = `<div class="sheet"><p class="big-msg" style="margin-top:0">어느 기록을 쓸까?</p>
<p class="sub">이 기기와 클라우드에 서로 다른 기록이 있다. 고르지 않은 쪽은 지워진다.</p>
<button class="btn" onclick="CLOUD.useCloud(CLOUD.pending)">클라우드 기록<br><small>${cloud.plays||0}판, 동아리원 ${m(cloud)}명</small></button>
<div style="height:8px"></div>
<button class="btn ghost" onclick="CLOUD.useLocal()">이 기기 기록<br><small>${S.plays||0}판, 동아리원 ${m(S)}명</small></button></div>`;
        $('#modal').hidden = false;
      }
    } catch (e) { busy = false; C.status = '클라우드 연결 실패. 이 기기에는 계속 저장된다.'; }
    rerender();
  });
}
</script>
</body>
</html>
